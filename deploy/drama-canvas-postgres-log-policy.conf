-- Applied through ALTER SYSTEM so PostgreSQL is the source of truth.
ALTER SYSTEM SET log_statement = 'none';
ALTER SYSTEM SET log_min_duration_statement = '3000ms';
ALTER SYSTEM SET log_parameter_max_length = '2048';
ALTER SYSTEM SET log_parameter_max_length_on_error = '2048';
ALTER SYSTEM SET log_rotation_age = '1d';
ALTER SYSTEM SET log_rotation_size = '256MB';
ALTER SYSTEM SET log_truncate_on_rotation = 'on';
ALTER SYSTEM SET log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log';
SELECT pg_reload_conf();

[pytest]
addopts = --ignore-glob=tmp*
# 根目录有 480+ 个 _tmp_* 调试脚本和 deliverables/ 里的整套 skill 打包副本，
# 默认递归收集会把 deliverables 下两份同名的 test_project_bundle.py 等一起收进来，
# 模块名冲突直接中断整轮收集（"import file mismatch"），导致 pytest 在根目录根本
# 跑不起来、只能手工点名单个文件。这里限定收集范围：只收应用本身的测试。
testpaths = .
norecursedirs =
    .*
    _tmp_*
    tmp*
    _beef_inspect
    __pycache__
    build
    dist
    node_modules
    venv
    deliverables
    agent
    drama-canvas-studio-pg
    data
    uploads
    web
    web-vimax
    .deploy-release-*
    .release-*
python_files = test_*.py
python_classes = *Tests
python_functions = test_*
